<!DOCTYPE html>
<html lang="en">
<head>
    <title>Login Page</title>

    <style>
        body {
            background-color: #fce4ec;
        }
        td {
            padding: 10px;
        }

    </style>
</head>

<body>
    <center>
        <h1>Welcome to INSTAGRAM Login</h1>

        <table>
            <tr>
                <td>Name</td>
                <td><input type="text" placeholder="Enter your name"></td>
            </tr>

            <tr>
                <td>Password</td>
                <td><input type="password" placeholder="Enter your password"></td>
            </tr>

            <tr>
                <td>Date of Birth</td>
                <td><input type="date"></td>
            </tr>

            <tr>
                <td>Upload your Photo</td>
                <td><input type="file"></td>
            </tr>

            <tr>
                <td>Mobile No</td>
                <td><input type="number" placeholder="Enter your mobile no"></td>
            </tr>

            <tr>
                <td>Aadhar Card</td>
                <td><input type="number" placeholder="Enter your Aadhar card no"></td>
            </tr>
        </table>

        <br>

        <button type="submit">Submit</button>
    </center>
</body>
</html>
