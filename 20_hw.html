<!DOCTYPE html>
<html>
<head>
    <style>
        .box{
            border:2px solid black;
            background-color: wheat;
            height: 600px;
            width: 200px;
            padding-top: 50px;
            margin-top: 100px;
            margin-left: 700px;
            margin-right: 250px;
            text-align: center;

           
        
        }

        .Red{
            width: 100px;
            height: 100px;
            background-color: red;
            border-radius: 50%;
            margin-left: 50px;
            margin-top:50px;
            margin-bottom: 50px;
            
            
            
        }


        .Orange{
            width: 100px;
            height: 100px;
            background-color: orange;
            border-radius: 50%;
            margin-left: 50px;
            margin-bottom: 100px;
            margin-top: 70px;

        }


        .Green{
            width: 100px;
            height: 100px;
            background-color: green;
            border-radius: 50%;
            margin-left: 50px;
            margin-top:100px;   
            margin-bottom: 50px;  
        }
    </style>
</head>

<body>

    <div class="box">
        <div class="Red"></div>
        <div class="Orange"></div>
        <div class="Green"></div>
    </div>

</body>
</html>
