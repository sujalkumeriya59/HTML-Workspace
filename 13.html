<!DOCTYPE html>
<html lang="en">

<head>

    <title>Registeration Page</title>
</head>
<body style = "background-color: blanchedalmond;">
    <center><h1> User Registeration Page for Job</h1><hr>

    <form action="" method="get">
        <table border="1">

            <!-- # Textbox -->
            <tr>
                <td>Username: <input type="text", name="", placeholder="Enter your name"><br><br></td>
            </tr>

<!-- 
            # TextArea -->
            <tr>
                <td>Address: <textarea name="text", rows="5", columns="20", placeholder="Enter your Address"></textarea><br><br></td>
            </tr>


            <!-- # Radio Button -->
            <tr>
                <td>Gender: Male   <input type="radio", name="gender", value="Male">
                            Female <input type="radio", name="gender", value="Female">
                            Other  <input type="radio", name="gender", value="Other"><br><br>
                </td>
            </tr>
        
    
            <!-- # Checkbox -->
            <tr>
                <td> Skills: Python <input type="checkbox", name="skills", value="Python">
                    DA <input type="checkbox", name="skills", value="DA">
                    DS <input type="checkbox", name="skills", value="DS">
                    MERN <input type="checkbox", name="skills", value="MERN"><br><br>
                </td>
            </tr>

            <!-- # Dropdown -->
            <tr>
                <td>Country: <select name="country", value="">
                    <option value="us">USA</option>
                    <option value="uk">UK</option>
                    <option value="Ind">INDIA</option>
                    <option value="Russ">RUSSIA</option>
                    <option value="Chin">CHINA</option>
                </select><br><br>
                </td>
            </tr>

            <!-- # Register Button -->
            <tr>
                <td align="center"><button type="register">Register</button></td>
            </tr>
    

           

        </table>

    </form>
    </center>
    
</body>
</html>
